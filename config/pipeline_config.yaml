# FAST-LIO + Localization pipeline configuration

data:
  # Bag file path relative to /data inside container
  bag: "workshop/state1_art_filtered.bag"
  # Reference cloud for alignment (relative to /data)
  reference_cloud: "workshop/state1_0.01.ply"
  # Downsampled reference (used for faster computation)
  downsampled_reference_cloud: "workshop/state1_0.01.ply"

processing:
  # Duration to extract from rosbag (seconds)
  duration: 40
  # Time interval between alignment operations (seconds)
  align_interval: 2.0
  # Accumulate point clouds from last N seconds
  map_accumulation_time: 2.0
  # Max poses kept in the trajectory buffers; oldest are dropped beyond this
  trajectory_buffer_size: 100000

alignment:
  # Voxel size for global alignment feature computation
  voxel_size_global: 0.4
  # Voxel size for local ICP alignment
  voxel_size_local: 0.1
  # Distance threshold for ICP correspondence
  icp_threshold: 0.5
  # Global alignment method (FPFH_RANSAC)
  global_method: "FPFH_RANSAC"
  # Local alignment method (P2PLANE_ICP is more robust)
  local_method: "P2PLANE_ICP"
  # Basin-switch thresholds: a transform jump beyond either rebuilds the
  # saved reference trajectory (live publishers unaffected).
  rebase_rotation_deg: 20.0
  rebase_translation_m: 0.5
  # Optional initial-pose hint (leave null normally): a 4x4 transform file
  # path, [x, y, z, qx, qy, qz, qw] start pose, or a 16-element matrix.
  initial_pose: null

topics:
  # Point cloud topic from FAST-LIO (should contain registered cloud)
  cloud_registered: "/cloud_registered"
  # Odometry topic from FAST-LIO
  odometry: "/Odometry"
  # Output: transformed odometry in reference frame
  odometry_ref: "/localization/odometry_ref"
  # Output: transformation matrix (reference frame to map frame)
  transform: "/localization/transform"
  # Output: fitness scores from alignment
  fitness: "/localization/fitness"

output:
  # Output directory (inside container: /results)
  dir: "/results"